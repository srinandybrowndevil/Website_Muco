<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="full_primary" x1="20" y1="110" x2="110" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="full_arrow" x1="50" y1="90" x2="110" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Group Logo Mark scaled to 100x100 at x=10, y=10 -->
  <g transform="translate(10, 10) scale(0.625)">
    <!-- Left Pillar -->
    <path d="M36 126V46C36 41.58 39.58 38 44 38H54C58.42 38 62 41.58 62 46V126C62 130.42 58.42 134 54 134H44C39.58 134 36 130.42 36 126Z" fill="url(#full_primary)" />
    <!-- Chevron -->
    <path d="M54 48L80 84L106 48" stroke="url(#full_primary)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Ascending Vector -->
    <path d="M98 126V58C98 54 100 50 104 46L130 20C132.5 17.5 137 19 137 23V126C137 130.42 133.42 134 129 134H119C114.58 134 111 130.42 111 126V72L101 82C99 84 98 88 98 92V126Z" fill="url(#full_arrow)" />
    <!-- Rocket Head -->
    <path d="M116 20H140V44" stroke="#c084fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulse Spark -->
    <circle cx="80" cy="84" r="6.5" fill="#ffffff" />
  </g>

  <!-- Typography: MUCO Labs -->
  <text x="125" y="74" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" fill="#f8fafc" letter-spacing="-1px">
    MUCO<tspan fill="#38bdf8" font-weight="600"> Labs</tspan>
  </text>
  
  <!-- Subtle Tagline / Location (Optional elegance) -->
  <text x="127" y="96" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="12" fill="#94a3b8" letter-spacing="2.5px">
    SOFTWARE · SAAS · GROWTH
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="m1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="m2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="m3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#06080d"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- 3D Geometric Intertwined M Ribbon -->
  <g filter="url(#shadow)" transform="translate(10, 10)">
    <!-- Left Pillar -->
    <path d="M12 66 V26 L26 16 V56 Z" fill="url(#m2)"/>
    <path d="M12 26 L26 16 L38 24 L24 34 Z" fill="url(#m3)"/>

    <!-- Left to Center Fold -->
    <path d="M24 34 L38 24 L52 48 L38 58 Z" fill="url(#m1)"/>

    <!-- Center to Right Fold -->
    <path d="M52 48 L42 32 L56 22 L66 38 Z" fill="url(#m2)"/>

    <!-- Right Pillar -->
    <path d="M56 22 L70 12 L70 52 L56 62 Z" fill="url(#m1)"/>
    <path d="M42 62 L56 52 L56 68 L42 78 Z" fill="url(#m2)"/>

    <!-- Glowing Core Accent -->
    <circle cx="40" cy="40" r="3.5" fill="#38bdf8" opacity="0.9"/>
  </g>
</svg>

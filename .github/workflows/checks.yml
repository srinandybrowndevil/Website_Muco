name: checks

# Every guarantee in the delivery reports came from a probe someone ran by hand
# once. This runs them again on every push, so they keep holding after the
# session that made them ended.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: marketing site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Build the site
        run: python build.py

      # The generator writes vercel.json, which carries the Content-Security-
      # Policy. A build that changes the policy and forgets a host looks
      # perfectly healthy here and blocks a script in the browser -- which is
      # exactly how Clarity ran for nobody. The browser tests below are what
      # catch that, so a clean build is necessary and not sufficient.
      - name: Fail if the build left the tree dirty
        run: git diff --exit-code -- . ':!package-lock.json'

      # What a browser will never complain about: a page with no description,
      # two pages claiming the same title, an image with no alt text, a heading
      # level skipped, a photograph shipped at two megabytes.
      - name: Audit every page
        run: python scripts/site-audit.py

      - run: npm ci
      - run: npm test

      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test tests/marketing.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-site
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  workspaces:
    name: four workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Types prove the code agrees with itself. This proves it agrees with the
      # database: every column and foreign key named in a select has to exist
      # in the migrations. It reads all four applications and both shared
      # packages, because four apps mean four chances to name a column that was
      # renamed, and the one that breaks is the one nobody thought to check.
      - name: Check every query against the schema
        run: python scripts/schema-check.py

      - name: Install
        working-directory: workspaces
        run: npm ci

      # --workspaces --if-present, so adding a fifth application to the
      # monorepo puts it in CI without anybody editing this file.
      - name: Typecheck every application
        working-directory: workspaces
        run: npm run typecheck

      - name: Lint every application
        working-directory: workspaces
        run: npm run lint

      - name: Build every application
        working-directory: workspaces
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  workspaces-browser:
    name: four workspaces in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      # Each workspace refuses to serve without Supabase configured, which is
      # the right behaviour and means these cannot run until the two
      # publishable values are set as repository secrets. Skipped rather than
      # faked: a test that runs against a stub proves nothing about the real
      # thing.
      - name: Check the workspace secrets exist
        id: secrets
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Workspace browser tests skipped - set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY as repository secrets to enable them."
          fi

      - if: steps.secrets.outputs.present == 'true'
        run: npm ci
      - if: steps.secrets.outputs.present == 'true'
        working-directory: workspaces
        run: npm ci
      - if: steps.secrets.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.secrets.outputs.present == 'true'
        name: Browser tests
        run: npx playwright test tests/workspaces.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-workspaces
          path: |
            playwright-report/
            test-results/
          retention-days: 7
